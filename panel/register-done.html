<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登録完了 | シードメディカルパネル</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:        #243A52;
      --green:       #5F8475;
      --green-hover: #567A6C;
      --bg:          #F5F6F7;
      --border:      #E6E8EB;
      --text-main:   #2B2F33;
      --text-sub:    #6B7280;
      --success:     #4F7A6D;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial,
                   "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 64px 44px;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .logo-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 40px;
    }
    .logo-area video {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 6px;
    }
    .logo-text-ja {
      font-size: 15px;
      color: var(--navy);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    /* Steps complete */
    .steps {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }
    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      background: var(--green);
      color: #fff;
      flex-shrink: 0;
    }
    .step-label { font-size: 12px; color: var(--green); font-weight: 600; margin-left: 6px; }
    .step-line { height: 1px; background: var(--green); width: 40px; margin: 0 4px; }

    /* Icon */
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #EDF3F1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }
    .icon-wrap svg {
      width: 36px;
      height: 36px;
      color: var(--success);
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 12px;
    }
    p.body-text {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.8;
      margin-bottom: 36px;
    }

    .btn-primary {
      display: inline-block;
      padding: 0 40px;
      height: 48px;
      line-height: 48px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s;
      letter-spacing: 0.03em;
    }
    .btn-primary:hover { background: var(--green-hover); }

    footer {
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 18px 24px;
      text-align: center;
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .footer-links a {
      font-size: 12px;
      color: var(--text-sub);
      text-decoration: none;
    }
    .footer-links a:hover { text-decoration: underline; }
    .footer-copy { font-size: 11px; color: #a0aab4; }
  </style>
</head>
<body>

  <div class="page-wrap">
    <div class="card">

      <div class="logo-area">
        <video autoplay loop muted playsinline>
          <source src="Entry_HCP_Panel_web.mp4" type="video/mp4">
          <source src="edited_loop.webm" type="video/webm">
        </video>
        <div class="logo-text-ja">シードメディカルパネル</div>
      </div>

      <!-- Steps -->
      <div class="steps">
        <div class="step-num">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="step-label">規約確認</div>
        <div class="step-line"></div>
        <div class="step-num">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="step-label">基本情報入力</div>
        <div class="step-line"></div>
        <div class="step-num">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="step-label">登録完了</div>
      </div>

      <!-- Icon -->
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>

      <h1>登録が完了しました</h1>
      <p class="body-text">シードメディカルパネルへのご登録ありがとうございます。<br>アンケートのご依頼はメールにてお知らせいたします。</p>

      <a href="dashboard.html" class="btn-primary">ダッシュボードへ</a>

    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a href="https://www.seedplanning.co.jp/" target="_blank" rel="noopener">会社概要</a>
      <a href="https://www.seedplanning.co.jp/contact/" target="_blank" rel="noopener">お問い合わせ</a>
      <a href="https://www.seedplanning.co.jp/corporatepolicy/privacypolicy/" target="_blank" rel="noopener">個人情報保護方針</a>
    </div>
    <p class="footer-copy">Copyright &copy; Seed Planning, Inc. All rights reserved</p>
  </footer>

</body>
</html>
