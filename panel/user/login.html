<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ログイン | シードメディカルパネル</title>
<link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="member.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="member">
<header class="mb-header">
  <div class="mb-logo"><div class="logo-box">S</div>シードメディカルパネル</div>
  <a href="index.html" style="font-size:12px;color:var(--g500);text-decoration:none">← モック一覧</a>
</header>

<div class="mb-wrap">
  <div class="login-hero">
    <div style="width:52px;height:52px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px"><i data-lucide="stethoscope" style="width:28px;height:28px"></i></div>
    <h1>メンバー向けサイト</h1>
    <p>医療従事者の皆さまに調査へのご協力をお願いする<br>シードメディカルパネルのメンバー向けサイトです。</p>
  </div>
  <div class="login-body">
    <div class="fg">
      <label class="fl">メールアドレス</label>
      <input type="email" class="fi" placeholder="name@example.com">
    </div>
    <div class="fg">
      <label class="fl">パスワード</label>
      <input type="password" class="fi" placeholder="••••••••">
    </div>
    <div class="pw-link"><a href="#">パスワードをお忘れですか？</a></div>
    <button class="btn btn-pr wf" style="justify-content:center;padding:12px">ログイン</button>
    <div class="div-or">または</div>
    <a href="wf1-register.html" class="btn btn-out wf" style="justify-content:center;padding:12px;text-decoration:none">新規登録</a>
  </div>
  <div class="mb-trust">
    <span><i data-lucide="shield-check"></i>調査運営目的のみ使用</span>
    <span><i data-lucide="shield-check"></i>広告・営業配信なし</span>
    <span><i data-lucide="shield-check"></i>協力内容に応じた謝礼</span>
  </div>
</div>

</footer>
