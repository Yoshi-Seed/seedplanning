<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>パスワード設定・登録完了 | シードメディカルパネル</title>
<link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="member.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="member">
<header class="mb-header">
  <div class="mb-logo"><div class="logo-box">S</div>シードメディカルパネル</div>
  <a href="index.html" style="font-size:12px;color:var(--g500);text-decoration:none">← モック一覧</a>
</header>

<div class="mb-wrap">
  <div class="mb-title">登録完了</div>
  <div class="mb-lead">最後に8〜16桁のパスワードを設定してください。</div>

  <div class="stepper">
    <div class="stp done"><div class="stp-n"><i data-lucide="check" style="width:14px;height:14px"></i></div><div class="stp-lb">規約確認</div></div>
    <div class="stp-line done"></div>
    <div class="stp done"><div class="stp-n"><i data-lucide="check" style="width:14px;height:14px"></i></div><div class="stp-lb">基本情報入力</div></div>
    <div class="stp-line done"></div>
    <div class="stp on"><div class="stp-n">3</div><div class="stp-lb">登録完了</div></div>
  </div>

  <div class="card">
    <div class="card-t" style="margin-bottom:18px"><i data-lucide="lock"></i>パスワード設定</div>
    <p style="font-size:13px;color:var(--g600);margin-bottom:16px">以下の内容をご入力ください。</p>

    <div class="fg">
      <label class="fl">パスワード（8〜16桁） <span class="req">*</span></label>
      <input type="password" class="fi" placeholder="入力してください">
    </div>

    <div class="fg">
      <label class="fl">パスワード（確認） <span class="req">*</span></label>
      <input type="password" class="fi" placeholder="もう一度入力してください">
      <div class="fh">パスワードは半角英数字、# ! _ @ などの記号で設定することができます。</div>
    </div>

    <button class="btn btn-pr wf" style="justify-content:center;padding:12px;margin-top:8px">
      <i data-lucide="check-circle"></i>登録を完了する
    </button>
  </div>
</div>

<footer class="mb-footer">
  <a href="#">会社概要</a>|<a href="#">お問い合わせ</a>|<a href="#">個人情報保護方針</a>
  <div style="margin-top:10px;font-size:11px;color:var(--g400)">Seed Medical Panel | Phase 1</div>
</footer>
<script>lucide.createIcons();</script>
</body></html>
