<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>新規登録 | シードメディカルパネル</title>
<link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="member.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="member">
<header class="mb-header">
  <div class="mb-logo"><div class="logo-box">S</div>シードメディカルパネル</div>
  <a href="index.html" style="font-size:12px;color:var(--g500);text-decoration:none">← モック一覧</a>
</header>

<div class="mb-wrap">
  <div class="mb-title">シードメディカルパネルへの<br>ご登録をご検討いただき、ありがとうございます。</div>
  <div class="mb-lead">メールアドレスをご入力いただくと、<br>登録手続きのご案内メールをお送りします。</div>

  <div class="card">
    <div class="fg">
      <label class="fl">メールアドレス <span class="req">*</span></label>
      <input type="email" class="fi" placeholder="name@example.com">
    </div>
    <div class="fg">
      <label class="cbl"><input type="checkbox"> 私は医療従事者として、シードメディカルパネルへの登録を希望します。</label>
    </div>
    <button class="btn btn-pr wf" style="justify-content:center;padding:12px;margin-top:8px">
      <i data-lucide="mail"></i>登録案内メールを送信する
    </button>
  </div>

  <div class="mb-trust">
    <span><i data-lucide="shield-check"></i>調査運営目的のみ使用</span>
    <span><i data-lucide="shield-check"></i>広告・営業配信なし</span>
    <span><i data-lucide="shield-check"></i>協力内容に応じた謝礼</span>
  </div>

  <div class="mb-sub-link">すでにご登録済みの方は <a href="login.html">こちら</a></div>
</div>

<footer class="mb-footer">
  <a href="#">会社概要</a>|<a href="#">お問い合わせ</a>|<a href="#">個人情報保護方針</a>
  <div style="margin-top:10px;font-size:11px;color:var(--g400)">Seed Medical Panel | Phase 1</div>
</footer>
<script>lucide.createIcons();</script>
</body></html>
