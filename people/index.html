<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザーデータベース</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: #f5f3ef;
      color: #2d2d2d;
      min-height: 100vh;
    }

    header {
      background: #5a3e2b;
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.04em; }

    .container { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.93rem;
    }
    thead {
      background: #7c5c3e;
      color: #fff;
    }
    thead th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    tbody tr {
      border-bottom: 1px solid #f0ece6;
      transition: background 0.15s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fdf8f4; }
    td { padding: 13px 16px; vertical-align: middle; }

    .pass-cell {
      font-family: monospace;
      color: #888;
      letter-spacing: 0.1em;
    }

    .btn-edit {
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn-edit:hover { background: #b45309; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 36px 32px 28px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }
    .modal h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #5a3e2b;
      margin-bottom: 24px;
    }

    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #666;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-group input {
      width: 100%;
      border: 1.5px solid #ddd;
      border-radius: 7px;
      padding: 10px 13px;
      font-size: 0.95rem;
      color: #2d2d2d;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    .form-group input:focus {
      outline: none;
      border-color: #d97706;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      justify-content: flex-end;
    }
    .btn-save {
      background: #5a3e2b;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 10px 24px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      transition: background 0.15s;
    }
    .btn-save:hover { background: #3e2a1a; }
    .btn-cancel {
      background: #f0ece6;
      color: #5a3e2b;
      border: none;
      border-radius: 7px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn-cancel:hover { background: #e0d9d0; }

    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: #15803d;
      color: #fff;
      padding: 13px 22px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 200;
    }
    .toast.error { background: #dc2626; }
    .toast.show { opacity: 1; transform: translateY(0); }

    .loading {
      text-align: center;
      padding: 60px;
      color: #888;
      font-size: 1rem;
    }

    @media (max-width: 700px) {
      thead th:nth-child(3), td:nth-child(3) { display: none; }
      .modal { padding: 24px 16px 20px; }
    }
  </style>
</head>
<body>

<header>
  <h1>ユーザーデータベース</h1>
</header>

<div class="container">
  <div class="card" id="tableWrapper">
    <div class="loading">読み込み中...</div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>ユーザー編集</h2>
    <input type="hidden" id="editId">

    <div class="form-group">
      <label>名前</label>
      <input type="text" id="editName" placeholder="山田 太郎">
    </div>
    <div class="form-group">
      <label>メールアドレス</label>
      <input type="email" id="editEmail" placeholder="example@mail.com">
    </div>
    <div class="form-group">
      <label>パスワード</label>
      <input type="text" id="editPassword" placeholder="パスワード">
    </div>
    <div class="form-group">
      <label>生年月日</label>
      <input type="date" id="editBirthday">
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="btnCancel">キャンセル</button>
      <button class="btn-save" id="btnSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = "/api/users";

  let users = [];

  async function loadUsers() {
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error(res.statusText);
      users = await res.json();
      renderTable();
    } catch (e) {
      document.getElementById("tableWrapper").innerHTML =
        `<div class="loading" style="color:#dc2626">データの取得に失敗しました: ${e.message}</div>`;
    }
  }

  function renderTable() {
    const wrapper = document.getElementById("tableWrapper");
    if (users.length === 0) {
      wrapper.innerHTML = '<div class="loading">データがありません</div>';
      return;
    }

    const rows = users.map(u => `
      <tr data-id="${u.id}">
        <td>${u.id}</td>
        <td>${esc(u.name)}</td>
        <td>${esc(u.email)}</td>
        <td class="pass-cell">${maskPassword(u.password)}</td>
        <td>${esc(u.birthday)}</td>
        <td><button class="btn-edit" onclick="openModal(${u.id})">編集</button></td>
      </tr>
    `).join("");

    wrapper.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>名前</th>
            <th>メールアドレス</th>
            <th>パスワード</th>
            <th>生年月日</th>
            <th></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function maskPassword(pw) {
    return pw ? "●".repeat(Math.min(pw.length, 8)) : "";
  }

  function esc(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Modal
  function openModal(id) {
    const u = users.find(x => x.id === id);
    if (!u) return;

    document.getElementById("editId").value = u.id;
    document.getElementById("editName").value = u.name;
    document.getElementById("editEmail").value = u.email;
    document.getElementById("editPassword").value = u.password;
    document.getElementById("editBirthday").value = u.birthday;

    document.getElementById("modalOverlay").classList.add("open");
  }

  function closeModal() {
    document.getElementById("modalOverlay").classList.remove("open");
  }

  document.getElementById("btnCancel").addEventListener("click", closeModal);
  document.getElementById("modalOverlay").addEventListener("click", e => {
    if (e.target === document.getElementById("modalOverlay")) closeModal();
  });

  document.getElementById("btnSave").addEventListener("click", async () => {
    const id       = document.getElementById("editId").value;
    const name     = document.getElementById("editName").value.trim();
    const email    = document.getElementById("editEmail").value.trim();
    const password = document.getElementById("editPassword").value;
    const birthday = document.getElementById("editBirthday").value;

    if (!name || !email || !birthday) {
      showToast("名前・メール・生年月日は必須です", true);
      return;
    }

    try {
      const res = await fetch(`${API}/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password, birthday }),
      });

      if (!res.ok) {
        const msg = await res.text();
        throw new Error(msg || res.statusText);
      }

      const updated = await res.json();
      const idx = users.findIndex(x => x.id === updated.id);
      if (idx !== -1) users[idx] = updated;

      renderTable();
      closeModal();
      showToast("保存しました");
    } catch (e) {
      showToast("保存に失敗しました: " + e.message, true);
    }
  });

  // Toast
  let toastTimer;
  function showToast(msg, isError = false) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "toast" + (isError ? " error" : "");
    requestAnimationFrame(() => el.classList.add("show"));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
  }

  loadUsers();
</script>
</body>
</html>
